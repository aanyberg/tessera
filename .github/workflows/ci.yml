name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (stable)
    runs-on: macos-15
    # A normal run is well under 20 minutes; a hang fails the job instead of stalling merges (#137).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # The C programs in crates/tessera-ffi/tests/c, against the generated header and the static library (#175).
      - run: scripts/ffi-c-test.sh
      - run: cargo xtask config-docs --check
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check

  app:
    name: macOS app
    runs-on: macos-15
    needs: rust
    # A normal run of just app-test is 12-14 minutes (the suite has grown; a run that passed every test took 14:02 against
    # a 14 minute step limit and timed out). just app-test hung three times (#121); the job limit is the backstop for a hang
    # below the test level, the step limit and xcodebuild's per-test timeouts (in the justfile) report it earlier.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install just cbindgen xcodegen
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: just app
      - run: just app-test
        timeout-minutes: 18
      # After a failed, timed-out or cancelled test step the full xcodebuild logs name the hanging test (#121). The
      # step limit (18 min) is below the job limit (25 min), so this step still runs after a step timeout.
      - name: Upload app test logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-logs
          path: apps/macos/build/app-test*.log
          if-no-files-found: warn
          retention-days: 14
