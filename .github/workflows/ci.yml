name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the macOS app job can affect the result (#417). The rules live in scripts/ci-app-affected.sh, which is
  # conservative: the app links the xcframework built from tessera-ffi, so any change to a crate it depends on runs the
  # job. Pushes to main always run it. A skipped required job counts as passing for branch protection (a workflow-level
  # `paths:` filter would leave the check pending forever), and the check name `macOS app` does not change.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      app: ${{ steps.decide.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The script's reason for a fail-safe `true` (no cargo, no jq, a bad ref) is on stderr: keep it in the job
          # summary as well as the log, so a docs-only PR that ran the macOS job says why.
          why="$RUNNER_TEMP/ci-app-affected.err"
          if [ "$EVENT" != pull_request ]; then
            app=true
          else
            app="$(scripts/ci-app-affected.sh --base "$BASE_SHA" --head HEAD 2> "$why")" || app=true
            cat "$why" >&2
          fi
          case "$app" in true|false) ;; *) echo "unexpected decision: $app" >&2; app=true ;; esac
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "macOS app job: $app" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$why" ]; then
            { echo; echo '```'; cat "$why"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  rust:
    name: Rust (stable)
    runs-on: macos-15
    # A normal run is well under 20 minutes; a hang fails the job instead of stalling merges (#137).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
      # The C programs in crates/tessera-ffi/tests/c, against the generated header and the static library (#175).
      - run: scripts/ffi-c-test.sh
      - run: cargo xtask config-docs --check
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check

  app:
    name: macOS app
    runs-on: macos-15
    # Runs in parallel with `rust` (no `needs: rust`, ~7 minutes saved per PR); when `rust` fails this job still runs and
    # both required checks must pass anyway. Skipped only when `changes` succeeded and said false: a failed `changes`
    # job runs the app job (a skipped required job would otherwise count as a pass).
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    # A normal run of just app-test is 12-14 minutes (the suite has grown; a run that passed every test took 14:02 against
    # a 14 minute step limit and timed out). just app-test hung three times (#121); the job limit is the backstop for a hang
    # below the test level, the step limit and xcodebuild's per-test timeouts (in the justfile) report it earlier.
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install just cbindgen xcodegen
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: just app
      # 30 minutes: macos-15 hits the fork deadlock of #278 in this step (its partner in #443 is AppKit's NSPersistentUI
      # queue); each hang costs the watchdog's 150 s plus a restart, and 6 hangs in 3 runs passed 18 minutes. Fixing the
      # hangs is #278 and #443; this only keeps a run that recovers from being cut off.
      - run: just app-test
        timeout-minutes: 30
      # The console shows only the first line of a compiler error (wave 21: three toolchain differences were read from
      # it): on a failure, print the last 30 lines of each xcodebuild log. The full logs are uploaded below.
      - name: Tail of the app test logs
        if: failure()
        run: |
          shopt -s nullglob
          for log in apps/macos/build/app-test*.log; do
            echo "::group::last 30 lines of $log"
            tail -n 30 "$log"
            echo "::endgroup::"
          done
      # After a failed, timed-out or cancelled test step the full xcodebuild logs name the hanging test (#121). The
      # step limit (30 min) is below the job limit (37 min), so this step still runs after a step timeout.
      - name: Upload app test logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-logs
          path: apps/macos/build/app-test*.log
          if-no-files-found: warn
          retention-days: 14
      # A crash with no frames (a TSan SEGV) leaves no line in those logs; the result bundles xcodebuild writes
      # under the derived data path (`just app-test` passes apps/macos/DerivedData) keep the record.
      - name: Upload app test result bundles
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-xcresult
          path: apps/macos/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
