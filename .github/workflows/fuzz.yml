name: Fuzz

# Nightly libFuzzer runs of the cargo-fuzz targets in fuzz/ (#14): five
# minutes per target, the corpus carried from run to run in the Actions
# cache. Ubuntu: nothing in tessera-vt, -grid or -term is platform-specific,
# and the minutes are cheaper than macOS ones.
#
# The nightly toolchain is pinned (FUZZ_TOOLCHAIN) so the build cache hits
# from night to night. To bump it: pick a newer dated nightly
# (`rustup toolchain install nightly-YYYY-MM-DD --profile minimal`), check
# `cargo +nightly-YYYY-MM-DD fuzz build` locally, change FUZZ_TOOLCHAIN and
# run the workflow once by hand (workflow_dispatch, seconds 60).
#
# Two traps, both fixed below: rust-toolchain.toml (stable) beats the
# default toolchain, so RUSTUP_TOOLCHAIN selects the nightly for every step;
# and the prebuilt cargo-fuzz is a musl binary that defaults --target to its
# own triple, so every cargo fuzz call passes --target "$FUZZ_TRIPLE".

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (1-3600)
        required: false
        default: '300'
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_TOOLCHAIN: nightly-2026-10-29
  FUZZ_TRIPLE: x86_64-unknown-linux-gnu

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [parser, terminal, chunking, resize]
    env:
      TARGET: ${{ matrix.target }}
      # Empty on a schedule run: the default applies.
      FUZZ_SECONDS: ${{ inputs.seconds || '300' }}
    steps:
      - name: Check the run length
        run: |
          case "$FUZZ_SECONDS" in
            ''|*[!0-9]*) echo "::error::seconds must be a whole number, got '$FUZZ_SECONDS'"; exit 1 ;;
          esac
          if (( 10#$FUZZ_SECONDS < 1 || 10#$FUZZ_SECONDS > 3600 )); then
            echo "::error::seconds must be 1-3600, got $FUZZ_SECONDS"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      # From here on, so rust-cache keys and cargo fuzz build with the nightly
      # instead of the stable that rust-toolchain.toml selects. Set after the
      # install so rustup never resolves a toolchain that is not there yet.
      - name: Select the fuzz toolchain
        run: echo "RUSTUP_TOOLCHAIN=$FUZZ_TOOLCHAIN" >> "$GITHUB_ENV"
      # The workspace's lock, so the fuzzers test the workspace's dependency
      # versions (fuzz/Cargo.lock is not committed).
      - name: Use the workspace lock file
        run: cp Cargo.lock fuzz/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Show the toolchain
        run: |
          active="$(rustup show active-toolchain)"
          echo "$active"
          rustc -V
          cargo fuzz --version
          case "$active" in
            "$FUZZ_TOOLCHAIN"-*) ;;
            *) echo "::error::active toolchain is not $FUZZ_TOOLCHAIN: $active"; exit 1 ;;
          esac
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Build
        run: cargo fuzz build --target "$FUZZ_TRIPLE" "$TARGET"
      - name: Replay the regressions
        # Files only, so a subdirectory can never turn the replay into a
        # fuzzing run (libFuzzer fuzzes when given a directory).
        run: |
          inputs=()
          if [[ -d "fuzz/regressions/$TARGET" ]]; then
            mapfile -d '' -t inputs < <(find "fuzz/regressions/$TARGET" -type f -print0 | sort -z)
          fi
          if (( ${#inputs[@]} == 0 )); then
            echo "no regression inputs for $TARGET"
            exit 0
          fi
          cargo fuzz run --target "$FUZZ_TRIPLE" "$TARGET" "${inputs[@]}" -- -timeout=60
      - name: Fuzz
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo fuzz run --target "$FUZZ_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$((10#$FUZZ_SECONDS))" -timeout=60 -print_final_stats=1
      - name: Minimise the corpus
        run: cargo fuzz cmin --target "$FUZZ_TRIPLE" "$TARGET" "fuzz/corpus/$TARGET"
      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
