[package]
name = "tessera-pty"
description = "Pseudo-terminal spawning, I/O and resizing (platform layer)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
portable-pty.workspace = true
# `hostname` for `local_hostname` (the remote-host indicator, #205).
nix = { workspace = true, features = ["feature", "hostname", "signal"] }
thiserror.workspace = true
tracing.workspace = true

# `proc_name` and `proc_pidinfo` for the foreground job's name (macOS only;
# Linux reads `/proc`).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
# `waitpid` proves a refused spawn left no child behind.
nix = { workspace = true, features = ["feature", "hostname", "process", "signal"] }

[lints]
workspace = true
