[package]
name = "tessera-ffi"
description = "C ABI exposed to native frontends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tessera-app-core.workspace = true
tracing.workspace = true

[features]
# Rust-only hooks for this crate's own tests (never exported to C).
test-hooks = ["tessera-app-core/test-hooks"]

[dev-dependencies]
# Enables `test-hooks` for this crate's integration tests.
tessera-ffi = { path = ".", features = ["test-hooks"] }
# Theme values for the re-theming test of attached views.
tessera-config.workspace = true
# Temporary configuration directories (`TESSERA_CONFIG_DIR`).
tempfile = "3"

[lints]
workspace = true

[lib]
name = "tessera_ffi"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
cbindgen = "0.29"
