language = "C"
include_guard = "TESSERA_CORE_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from crates/tessera-ffi. Do not edit. */"
include_version = true
documentation = true
documentation_style = "doxy"
cpp_compat = true
usize_is_size_t = true

[export]
prefix = "Tessera"
# Enums that structs and arguments carry as fixed-width integers (so C can
# never hand Rust an invalid discriminant) are not reachable from any
# signature; list them so their named values reach the header.
include = [
    "Key", "KeyEventKind", "Modifiers", "MouseButton", "MouseEventKind", "ScrollTarget", "Granularity", "SearchRefusal",
]
# Constants are `#define`d with C-style names instead of the type prefix.
renaming_overrides_prefixing = true

[export.rename]
"MAX_ROWS" = "TESSERA_MAX_ROWS"
"MAX_COLS" = "TESSERA_MAX_COLS"
"FOREGROUND_NAME_LEN" = "TESSERA_FOREGROUND_NAME_LEN"
"MAX_PROFILE_NAME_LEN" = "TESSERA_MAX_PROFILE_NAME_LEN"
"SEARCH_REGEX" = "TESSERA_SEARCH_REGEX"
"SEARCH_CASE_SENSITIVE" = "TESSERA_SEARCH_CASE_SENSITIVE"
"SEARCH_MAX_QUERY_BYTES" = "TESSERA_SEARCH_MAX_QUERY_BYTES"
"SEARCH_MAX_MATCHES" = "TESSERA_SEARCH_MAX_MATCHES"
"SEARCH_MAX_MATCHES_TEXT_BYTES" = "TESSERA_SEARCH_MAX_MATCHES_TEXT_BYTES"
"SEARCH_MAX_STEP_MICROS" = "TESSERA_SEARCH_MAX_STEP_MICROS"
"HANDLE_KEY_BINDINGS_ONLY" = "TESSERA_HANDLE_KEY_BINDINGS_ONLY"
"NO_COMMAND" = "TESSERA_NO_COMMAND"
"MAX_CONFIG_VALUE_LEN" = "TESSERA_MAX_CONFIG_VALUE_LEN"
"MAX_THEME_PATH_LEN" = "TESSERA_MAX_THEME_PATH_LEN"
"THEME_ID_LEN" = "TESSERA_THEME_ID_LEN"

[enum]
# `TESSERA_ERROR_OK`, `TESSERA_ERROR_NULL_POINTER`, …: C enumerators share
# one namespace, so each carries its type's name.
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
rename_args = "snake_case"
