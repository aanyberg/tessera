language = "C"
include_guard = "TESSERA_CORE_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from crates/tessera-ffi. Do not edit. */"
include_version = true
documentation = true
documentation_style = "doxy"
cpp_compat = true
usize_is_size_t = true

[export]
prefix = "Tessera"
# Enums that structs carry as fixed-width integers (so C can never hand Rust
# an invalid discriminant) are not reachable from any signature; list them
# so their named values reach the header.
include = ["Key", "KeyEventKind", "Modifiers", "MouseButton", "MouseEventKind"]

[enum]
# `TESSERA_ERROR_OK`, `TESSERA_ERROR_NULL_POINTER`, …: C enumerators share
# one namespace, so each carries its type's name.
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
rename_args = "snake_case"
