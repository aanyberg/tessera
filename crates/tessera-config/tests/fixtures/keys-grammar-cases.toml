# Tessera #43 (key bindings): the chord and value grammar of ADR 0036.
#
# Ported from the spec-researcher's fixture (chord-grammar.json, wave 13):
# every case below is one of its cases, with its prose expectation turned
# into a machine-checked one by tests/keys_spec.rs. `rule` and `cite` are
# the researcher's; `expect_prose` is the original expectation.
#
#   [[chord]]   canonical = printed form of the parsed chord, or
#               error = the ChordError variant; shadows = rule R10 warning.
#   [[value]]   action = command | unbound | ignore | text (bytes = hex),
#               or error = the KeyActionError variant, or registry = the
#               reason the command registry (tessera-app-core) rejects it.
#   [[table]]   whole-table behaviour; implemented case by case by `id`.

[[chord]]
input = "cmd+t"
canonical = "cmd+t"
shadows = false
expect_prose = "ok: super+t"
rule = "R2 ('cmd' = super)"
cite = "https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts"

