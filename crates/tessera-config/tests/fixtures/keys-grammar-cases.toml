rule = "R13"
cite = "Tessera decision (no upstream rule)"

[[value]]
input = "send_text:\\xff"
action = "text"
bytes = "ff"
expect_prose = "ok: single raw byte 0xFF (not UTF-8; written as is)"
rule = "R13; Zig \\x is a byte"
cite = "https://ghostty.org/docs/config/keybind"

[[value]]
input = "send_text:\\q"
error = "Escape"
expect_prose = "ERR unknown escape '\\q'"
rule = "R13"
cite = "Tessera decision (no upstream rule)"

[[value]]
input = "send_text:abc\\"
error = "Escape"
expect_prose = "ERR trailing backslash"
rule = "R13"
cite = "Tessera decision (no upstream rule)"

[[value]]
input = "send_text:"
error = "EmptySendText"
expect_prose = "ERR empty send_text (use 'none' to swallow a key)"
rule = "R12/R13"
cite = "Tessera decision (no upstream rule)"

[[value]]
input = "send_text:\\\\"
action = "text"
bytes = "5c"
expect_prose = "ok: one backslash"
rule = "R13"
cite = "https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts"

[[value]]
input = "send_text:\\0"
error = "Escape"
expect_prose = "ERR octal/NUL escape not supported (a NUL byte is expressible as \\x00)"
rule = "R13"
cite = "Tessera decision (no upstream rule)"

[[value]]
input = "send_text:\\x00"
action = "text"
bytes = "00"
expect_prose = "ok: NUL byte allowed (trusted config)"
rule = "R13; S4"
cite = "Tessera decision (no upstream rule)"

[[value]]
repeat = "a"
count = 4096
prefix = "send_text:"
action = "text"
bytes_len = 4096
expect_prose = "ok: exactly 4096 bytes after unescaping"
rule = "S5 boundary"
cite = "Tessera decision (no upstream rule)"

[[value]]
repeat = "a"
count = 4097
prefix = "send_text:"
error = "SendTextTooLong"
expect_prose = "ERR over 4096 bytes: warn, drop the entry"
rule = "S5"
cite = "Tessera decision (no upstream rule)"

[[value]]
repeat = "\\x41"
count = 1024
prefix = "send_text:"
action = "text"
bytes_len = 1024
expect_prose = "ok: 1024 bytes (length counts decoded bytes, not source)"
rule = "S5 'after unescaping'"
cite = "Tessera decision (no upstream rule)"

[[value]]
repeat = "\\x41"
count = 4097
prefix = "send_text:"
error = "SendTextTooLong"
expect_prose = "ERR 4097 bytes decoded (source is 16388 bytes: the TOML string itself is already capped by the config file limit)"
rule = "S5"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 1
input = "entry count 512"
expect_prose = "ok: 512 entries all kept"
rule = "S5 MAX_KEY_BINDINGS = 512"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 2
input = "entry count 513"
expect_prose = "entry 513 and later dropped with ONE 'too many key bindings' warning (not one per entry: flood test)"
rule = "S5"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 3
input = "two keys 'cmd+t' and 'cmd+t' in TOML"
expect_prose = "TOML itself rejects a duplicate key: config load error already (not our warning). Duplicates reach us as 'shift+cmd+d' vs 'cmd+shift+d' or 'cmd+?' vs 'cmd+shift+/'"
rule = "R9; TOML 1.0 spec: duplicate keys invalid"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 4
input = "'cmd+shift+d' = 'split_down' and 'shift+cmd+d' = 'split_down'"
expect_prose = "1 warning for the second key naming it ('duplicate chord ... same as ...'); first wins"
rule = "brief: duplicate chord"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 5
input = "'cmd+t' = 'new_window' (default cmd+t is new_tab)"
expect_prose = "user entry replaces default: new_tab loses its default chord unless re-bound; NOT a warning (override). new_tab still shows no key equivalent"
rule = "D3: [keys] overrides re-bind"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 6
input = "'cmd+n' = 'new_tab' while default cmd+n=new_window"
expect_prose = "override as above; new_window is now unbound (menu item loses key equivalent). One command with two chords is fine"
rule = "D3"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 7
input = "'cmd+w' = 'unbound'"
expect_prose = "menu Close Tab loses ⌘W; no warning"
rule = "R12"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 8
input = "'cmd+q' = 'send_text:x'"
expect_prose = "chord shadows menu item Quit (system command): warning 'chord shadows menu item quit' per D3 'a chord shadowing a menu item' — first entry (the user's) wins, menu item loses its key equivalent. Lead: should system items quit/hide/minimize be protected? (N10)"
rule = "D3"
cite = "Tessera decision (no upstream rule)"

[[table]]
id = 9
input = "'cmd+t' = 'new_tab' (same as default)"
expect_prose = "ok, no warning"
rule = "D3"
cite = "Tessera decision (no upstream rule)"

