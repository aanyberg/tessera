# Bundled-theme tests the implementer can write from this table:
#   * Theme::bundled_names() order (insta snapshot) and Theme::bundled(n).is_some() for each.
#   * each bundled TOML parses via Theme::parse; every colour round-trips.
#   * "Tessera Dark" equals tessera_render::Theme::default(): fg #e5e5e5, bg #000000, cursor #b0b0b0, selection #264f78 alpha 0.6,
#     ansi = xterm 16 as in render theme.rs (lines 238-242).
#   * Dracula bundled == importing dracula.itermcolors (section 2): proves importer and bundle agree (exact).
#   * Solarized Dark bundled ansi/fg/bg == importing base16-solarized-dark-legacy.yaml?  NO: base16 maps base03 -> ansi8 and
#     base0x ordering differs; the two are intentionally different. Do not assert.
#   * Solarized Dark bundled ~= importing solarized-dark-patched.itermcolors (Calibrated) for ansi1-6, ansi9 within 2 LSB.
#
# NOTICE / attribution: ship a header comment in each bundled file: "Dracula theme (c) Zeno Rocha, MIT, https://draculatheme.com"
# etc. cargo-deny does not cover data files; record the ten upstream licences in ADR 0019 (all MIT / Apache-2.0 / MIT-X11,
# compatible with Tessera's MIT OR Apache-2.0). Colour values are facts and carry little copyright of their own; the headers
# are for attribution courtesy and for the Gruvbox/Tokyo Night mixed-source cases.

# =============================================================================
# 8. Importer output shape and devtool   (tessera-devtool theme import <file> [--name <n>] [--out <dir>] [--force])
# =============================================================================
# D1  Format by extension: .itermcolors -> import_itermcolors ; .yaml/.yml -> import_base16 ; anything else -> error
#     "unrecognised theme format", exit code TOOL_FAILURE = 125 (crates/tessera-devtool/src/main.rs:21; clap usage errors are 2). Content sniffing is NOT done.
# D2  Output file: <out>/<slug>.toml where out defaults to ConfigPaths::themes_dir() of the default root.
#     tessera-config has NO env override today (no env::var in src/), so every test must pass --out.
#     Written with tessera_config::load::write_atomic (load.rs:437, takes &str contents).
# D3  slug(name): lowercase; every run of chars outside [a-z0-9] -> single '-'; trim '-' at both ends; if empty -> error
#     "empty theme name". Unicode letters are NOT transliterated (non-ASCII-only name -> empty slug -> error asking for --name).
#     Max 64 bytes after slugging (truncate at a char boundary, trim '-').
# D4  --name overrides Theme.name (and therefore the slug). Without --name: iTerm2 -> input file stem; base16 -> B4.
# D5  Existing <slug>.toml and no --force -> error, file untouched, non-zero exit. With --force -> replaced atomically.
# D6  --out directory is created if absent (create_dir_all)? DECISION: no - missing --out dir is an error; themes_dir is created by ConfigStore.
# D7  Stdout: the written path on success (one line). Nothing else on stdout. Diagnostics on stderr.

[[slug]]
