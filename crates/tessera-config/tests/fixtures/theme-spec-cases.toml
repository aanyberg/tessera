# =============================================================================
# 9. theme_for(config, theme)  (app-core view.rs): tessera_config::Theme -> tessera_render::Theme
# =============================================================================
# T1  colour: render Rgba = Rgba::from_srgb8(r,g,b).with_alpha(a/255) i.e. sRGB bytes decoded to LINEAR with the exact sRGB
#     EOTF (render theme.rs `from_srgb8`); alpha = a/255 as f32.
# T2  opacity: background.a = theme.background.a/255 * config.appearance.opacity (MULTIPLY; both 1.0 -> 1.0). Every other
#     colour keeps its own alpha, EXCEPT as today the renderer ignores alpha on non-background colours except `selection`.
#     DECISION NEEDED: brief says "opacity applied to the background alpha" - multiply is the only choice that is
#     idempotent for a translucent theme background and a default opacity of 1.0.
# T3  font_family/font_size/line_height/padding come from config exactly as today's code does; the theme supplies colours only.
# T4  Readback test: store-backed App, change appearance.theme from "Tessera Dark" to "Dracula", wait for ConfigEvent::Changed,
#     render offscreen; the clear colour readback equals the new background. The offscreen target's format matters
#     (Rgba::to_clear_color docs): in an *Srgb target #282a36 reads back as bytes (0x28,0x2a,0x36) +-1; in a Unorm target the
#     linear values land as bytes (0x05,0x06,0x0b)-ish. ASSERT IN THE SAME SPACE THE EXISTING OFFSCREEN TESTS USE and let the
#     readback tolerance be 1.

[[theme_for]]
theme_background = "#282a36"
config_opacity = 1.0
expect_background_alpha = "a = 1.0"
src = "T2"

[[theme_for]]
theme_background = "#282a36"
config_opacity = 0.5
expect_background_alpha = "a = 0.5"
src = "T2"

[[theme_for]]
theme_background = "#282a3680"
config_opacity = 1.0
expect_background_alpha = "a = 128/255 = 0.50196"
src = "T2"

[[theme_for]]
theme_background = "#282a3680"
config_opacity = 0.5
expect_background_alpha = "a = 0.25098"
src = "T2"

[[theme_for]]
theme_background = "#282a36"
config_opacity = 0.0
expect_background_alpha = "a = 0.0 (config opacity floor is whatever load.rs clamps to)"
src = "T2"

[[theme_for]]
theme_selection = "#264f7899"
expect_selection = "linear(0x26,0x4f,0x78) with alpha 0.6 (153/255 = 0.6 exactly); Tessera Dark theme_for == today's tessera_render::Theme::default() colours"
src = "T1"

# =============================================================================
# 10. WHAT THE BRIEF / ISSUE GET WRONG (also in the returned summary)
# =============================================================================
#  W1  Brief: "missing Color Space taken as sRGB". iTerm2 [S1] treats a missing/unknown Color Space as Calibrated (Generic RGB).
#  W2  Brief: "`Calibrated`/`P3` converted per the spec fixture ... follow iTerm2 if it treats Calibrated as sRGB". It does not;
#      Calibrated is a ~gamma-1.8 conversion (R3). The rule in the brief's own conditional therefore says convert.
#  W3  Brief: base16 "flat `key: \"value\"` lines ... reject anything nested". Only the archived legacy schemes are flat;
#      every current tinted-theming scheme nests the 16 colours under `palette:` (B2). Rejecting nesting rejects all new schemes.
#  W4  Brief: "base16 styling guide: base00..base0F to ANSI 0-15". The styling guide has no ANSI mapping; the mapping is a
#      convention of the base16 terminal templates (B1).
#  W5  Brief: "3 real .itermcolors files; use Dracula, Solarized Dark, Nord". mbadolato has no plain 'Solarized Dark'; the
#      closest are 'Solarized Dark Patched' (uncalibrated, no Color Space key - used here, and it is the best Calibrated fixture)
#      and 'iTerm2 Solarized Dark' (sRGB). Both exist; recommend keeping Patched as the Calibrated coverage and (optional) adding
#      a synthetic P3 file (not checked whether any mbadolato scheme uses P3; the synthetic P3 rows in section 3 cover it).
#  W6  Issue title says ".itermcolors importer" and body says "import ... from the Appearance pane"; the pane is #40.
#  W7  "ten popular themes": names fixed by the brief; Tessera Light has no upstream (original palette proposed above).
#  W8  Existing code: config.toml `appearance.theme` default is already "Tessera Dark" (src/lib.rs:170) and ConfigPaths::themes_dir()
#      already exists (paths.rs:56); store.rs already creates themes/. `Warning` currently has no ThemeNotFound variant.

