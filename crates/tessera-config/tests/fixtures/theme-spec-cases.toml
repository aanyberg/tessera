# =============================================================================
# 5. Theme file format (themes/*.toml)  -- Theme::parse / Theme::load
# =============================================================================
# F1  Shape (flat; the file IS the theme; no [appearance] table). DECISION: ansi is ONE array of 16 strings
#     (the brief's Theme.ansi is [Color;16]); other terminals for reference: Ghostty `palette = N=#hex` lines
#     + `background`/`foreground`/`cursor-color`/`selection-background`; WezTerm `[colors] ansi=[8] brights=[8]
#     cursor_bg selection_bg`; Alacritty `[colors.normal]/[colors.bright]` tables. Naming only; none is adopted.
#
#         name       = "Dracula"            # optional; absent -> file stem
#         foreground = "#f8f8f2"
#         background = "#282a36"
#         cursor     = "#f8f8f2"
#         selection  = "#44475a"
#         ansi       = ["#21222c", ... 16 entries ...]
#
# F2  Color string: `#rrggbb` or `#rrggbbaa`; hex digits either case; output (serialise) is lowercase, and `#rrggbb`
#     (no alias) when alpha == ff. Nothing else is accepted: no `rrggbb` without '#', no `#rgb`, no `#rrggbbaa`
#     with wrong length, no names, no whitespace padding. The error names the key (`foreground`, `ansi[3]`).
# F3  Required keys: foreground, background, cursor, selection, ansi. DECISION NEEDED: all required (a theme file
#     that omits cursor silently inheriting something is a footgun) vs. cursor/selection optional. Recommend required
#     for foreground/background/ansi and OPTIONAL cursor (= foreground) and selection (= importer rule R6), so
#     hand-written minimal themes work. Brief says "Theme { ... cursor: Color, selection: Color }" - resolved at parse time.
# F4  Unknown keys: ignored without error (forward compatibility; Theme::parse returns no warnings). The config.toml
#     loader warns on unknown keys (load.rs Warning::UnknownKey); themes have no warning channel in the brief.
# F5  Wrong-length ansi -> error naming `ansi` and the found count. Non-array/non-string element -> error naming `ansi[i]`.

