# =============================================================================
# Tessera #41 (themes): specification fixture for tessera-config.
# Intended repo path: crates/tessera-config/tests/fixtures/theme-spec-cases.toml
# Generated by a script from the real input files that sit beside it; every
# expected value below is machine-derived, not hand-typed. Do not hand-edit
# expected values without re-deriving them.
#
# Conventions
#   * "slot" order is ansi0..ansi15, foreground, background, cursor, selection.
#   * Expected colours are `#rrggbb` (or `#rrggbbaa` when alpha != 255).
#   * tolerance = 0 means exact match; tolerance = 1 means each channel may
#     differ by 1 (float implementation differences in the colour-space maths).
#   * Every case carries `src = "..."` citing the spec/source; "DECISION" marks
#     an ambiguity where the spec is silent or sources disagree, with the
#     recommended behaviour.
#
# SOURCES (all fetched 2026-10-28)
#   [S1] iTerm2 decoder  https://github.com/gnachman/iTerm2/blob/master/sources/Categories/NSDictionary%2BiTerm.m
#        (`-colorValueForKey:`): the only place a plist colour dict is decoded.
#   [S2] iTerm2 encoder/consts https://github.com/gnachman/iTerm2/blob/master/sources/Categories/NSColor%2BiTerm.m
#        (kEncodedColorDictionary* constants, `-dictionaryValuePreservingColorSpace`).
#   [S3] .itermcolors corpus  https://github.com/mbadolato/iTerm2-Color-Schemes (licence: NOASSERTION at repo level;
#        each scheme keeps its upstream licence. Fixture files are used as test data, attributed in each header.)
#   [S4] base16 styling guide https://github.com/chriskempson/base16/blob/main/styling.md
#        (defines base00..base0F ROLES only; it has NO terminal/ANSI mapping).
#   [S5] de-facto ANSI mapping: tinted-theming/tinted-shell templates/base16.mustache
#        https://github.com/tinted-theming/tinted-shell/blob/main/templates/base16.mustache
#        and tinted-theming/tinted-iterm2 templates/base16.mustache (selection = base02, cursor = base05).
#   [S6] base16 scheme file formats: legacy flat (tinted-theming/base16-schemes, archived, MIT)
#        https://github.com/tinted-theming/base16-schemes ; current nested "palette:" format
#        (tinted-theming/schemes, MIT, spec-0.11) https://github.com/tinted-theming/schemes/tree/spec-0.11/base16
#   [S7] Apple ColorSync "Generic RGB" ICC profile (what NSColor "calibrated RGB" resolves to on modern macOS),
#        dumped from CGColorSpace(name: kCGColorSpaceGenericRGB) on macOS 26: gamma 1.80078125 (461/256),
#        D50-PCS primaries rXYZ=(0.45430,0.24191,0.01489) gXYZ=(0.35335,0.67363,0.09064) bXYZ=(0.15665,0.08446,0.71957).
#   [S8] Display P3: SMPTE EG 432-1, sRGB transfer function, D65.
#   [S9] sRGB: IEC 61966-2-1.
# =============================================================================

[meta]
spec_issue = 41
researched = "2026-10-28"


# =============================================================================
# 1. GLOBAL RULES (the implementer asserts these through the cases below)
# =============================================================================
# R1  rounding        byte = floor(clamp(x, 0, 1) * 255 + 0.5).  NOT truncation.
#     src: Dracula.itermcolors Ansi 0 = 0.1294 -> 32.997 -> must be 0x21 (canonical #21222c); truncation
#     (which iTerm2's own -hexStringForDictionary: does for sRGB, [S2] line ~934) would give 0x20. DECISION: round.
# R2  colour space    key "Color Space" on each colour dict, decoded exactly like [S1]:
#       "sRGB"  -> components are sRGB, taken as is.
#       "P3"    -> Display P3, converted to sRGB (R4).
#       anything else, INCLUDING "Calibrated" AND A MISSING KEY AND UNKNOWN STRINGS -> treated as
#               NSColor `colorWithCalibratedRed:` == Generic RGB, converted to sRGB (R3).
#     !! The issue brief says "missing Color Space taken as sRGB". iTerm2 does the opposite ([S1] falls through to
#     colorWithCalibratedRed). The lead's own rule ("if iTerm2 itself treats Calibrated as sRGB, follow iTerm2")
#     does not apply: iTerm2 does NOT treat Calibrated as sRGB; it is a real ~gamma-1.8 conversion that shifts
#     mid-greys by +18/255 (0.5 -> 0x92). DECISION NEEDED (lead): recommend follow iTerm2 (missing == Calibrated);
#     evidence: solarized-dark-patched.itermcolors has NO Color Space key and, converted as Calibrated, reproduces
#     canonical Solarized (#dc322f, #859900, #b58900, #268bd2, ...) to within 1-2 LSB, whereas reading it as sRGB
#     gives the wrong #d11c24, #738a05, ... (this is also the bug in mbadolato's ghostty/'Solarized Dark Patched').
# R3  Calibrated -> sRGB   (verified against AppKit on an 11^3 grid: max deviation 1/255, 0 samples > 1)
#       lin  = max(v, 0) ^ 1.80078125                           (per channel)
#       out  = M_GEN * lin                                      (3x3, rows below)
#       M_GEN = [[ 1.0252633, -0.0262964,  0.0013185],
#                [ 0.0193830,  0.9479565,  0.0325841],
#                [-0.0017835, -0.0014664,  1.0031061]]
#       v_srgb = clamp(out,0,1) ; encoded = 12.92*x if x <= 0.0031308 else 1.055*x^(1/2.4) - 0.055
#     (M_GEN = inverse(sRGB D50 Bradford matrix) * Generic-RGB profile primaries, i.e. ColorSync's relative-colorimetric path.)
# R4  P3 -> sRGB           (verified against AppKit, same grid, max deviation 1/255)
#       lin  = srgb_eotf(v)  (P3 shares the sRGB transfer curve [S8])
#       out  = M_P3 * lin
#       M_P3 = [[ 1.2247450, -0.2249043,  0.0000000],
#               [-0.0420578,  1.0420810,  0.0000000],
#               [-0.0196423, -0.0786549,  1.0985372]]
#       then clamp(out,0,1) (out-of-gamut P3 saturates; no gamut mapping) and sRGB OETF as in R3.
# R5  alpha            "Alpha Component" absent -> 1.0 ([S1] default). Output `#rrggbb` when round(a*255) == 255,
#     else `#rrggbbaa` with aa = round(a*255). Alpha is never colour-space converted. DECISION: omit aa when opaque.
# R6  key requirements Ansi 0..15, Foreground, Background REQUIRED (ImportError::MissingKey("<plist key>")).
#     Cursor Color missing -> foreground.  Selection Color missing -> foreground with alpha 0x40 (`#rrggbb40`).
#     DECISION NEEDED: iTerm2 itself falls back to its defaults; Tessera has no neutral default that suits every theme,
#     so derive from the theme being imported. Extra keys (Bold/Link/Badge/Cursor Guide/Cursor Text/Selected Text/
#     "... (Light)"/"... (Dark)" variants) are ignored.
# R7  component parsing  <real> and <integer> both accepted; value outside 0..1 is clamped (not an error);
#     NaN/inf/non-numeric -> ImportError::BadComponent{key}. Plist must be XML or binary (the `plist` crate reads both).
# R8  theme name       iTerm2: file stem passed by the caller (the .itermcolors has no name key); devtool default
#     name = file stem of the input, `--name` overrides.


# =============================================================================
