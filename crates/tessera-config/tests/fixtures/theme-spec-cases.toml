# =============================================================================
# 7. Bundled themes (the ten files crates/tessera-config/themes/<slug>.toml)
# =============================================================================
# Every colour must be valid `#rrggbb[aa]`; every theme's name must equal the bundled name; names unique case-insensitively;
# each file starts with a comment header: licence + upstream URL (text below). Contrast figures are INFORMATIVE only
# (WCAG 2.x ratio of foreground over background) - do not assert on them except tessera-light (original, designed to pass).

[[bundled]]
name = "Tessera Dark"
