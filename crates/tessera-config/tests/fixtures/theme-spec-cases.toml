cmd = "tessera-devtool theme import tests/fixtures/dracula.itermcolors --out <tmp>"
expect = "<tmp>/dracula.toml exists, Theme::load == section 2 dracula row (+ name \"dracula\" = file stem), stdout is the path, exit 0"
src = "D1,D2,D4"

[[devtool_case]]
