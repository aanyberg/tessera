# =============================================================================
# 6. Lookup order: ConfigStore::theme()  (appearance.theme -> user file -> bundled -> default + warning)
# =============================================================================
# L1  Match key is the requested name, trimmed? NO trimming. Compared case-insensitively (Unicode simple fold,
#     use to_lowercase) against (a) the FILE STEM of themes/*.toml and (b) the `name` key inside each file.
#     Order: user dir first (stem match before name-key match within it), then bundled names, then default.
# L2  A user file shadows a bundled theme of the same name.
# L3  Fallback = Tessera Dark + Warning::ThemeNotFound{name}; surfaced through last_warnings(). Also a
#     Warning when the matching user file exists but fails to parse (DECISION NEEDED: Warning::ThemeInvalid{name,error}
#     then continue to bundled/default - recommended; brief lists only ThemeNotFound. Falling through silently to the
#     bundled theme of the same name would hide the user's typo).
# L4  appearance.theme is a NAME, never a path: names containing '/', '\\' or '..' are not looked up on disk
#     (treated as not found -> bundled/default + warning). Prevents themes_dir() escape.

