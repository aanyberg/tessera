# =============================================================================
# 4. base16: slot mapping (rule B1) and three real files
# =============================================================================
# B1  The base16 styling guide [S4] defines ROLES only and says nothing about ANSI. The de-facto mapping used by
#     every base16 terminal template [S5] is:
#       ansi0=base00  ansi1=base08  ansi2=base0B  ansi3=base0A  ansi4=base0D  ansi5=base0E  ansi6=base0C  ansi7=base05
#       ansi8=base03  ansi9=base08  ansi10=base0B ansi11=base0A ansi12=base0D ansi13=base0E ansi14=base0C ansi15=base07
#       foreground=base05  background=base00  cursor=base05  selection=base02
#     (base09 and base0F are NOT ANSI colours; base01/02/04/06 appear only in the 256-colour extension, color18-21.)
#     Light schemes use the same mapping unchanged (tinted-shell does; ansi0 is then a light colour). DECISION: no
#     light/dark special-casing; the user picks a light scheme and gets base16 semantics.
#     Cursor/foreground/background/selection alpha is always opaque (base16 has no alpha).
# B2  FILE FORMAT (the brief is half wrong). Two formats exist in the wild:
#       legacy flat  (tinted-theming/base16-schemes, ARCHIVED; chriskempson-era):  scheme: "Name" / author: "..." /
#                    base00: "002b36"  (six hex digits, NO '#', usually double-quoted)
#       current nested (tinted-theming/schemes, spec-0.11, what every new scheme uses): top-level `system: "base16"`,
#                    `name:`, `author:`, `variant:`, optional `description:`, then `palette:` with 2-space-indented
#                    `base00: "#282a36"` (WITH '#', quoted, trailing `# comments` common).
#     The brief's rule "reject anything nested with ImportError::Unsupported" would reject EVERY currently published
#     scheme. DECISION NEEDED (lead): recommend a hand parser that accepts both: top-level scalar keys, plus ONE
#     nested mapping named `palette:` whose children are indented scalars; any other nesting/lists/anchors ->
#     Unsupported(line). The "flat" claim in the brief holds only for the legacy format.
# B3  hex values: optional surrounding single/double quotes, optional leading '#', 6 hex digits, either case;
#     output lowercased. 3-digit / 8-digit / non-hex -> ImportError::BadHex{key,value}. Trailing ` # comment` after the
#     value is stripped when the '#' is outside quotes and preceded by whitespace (dracula.yaml has them).
# B4  name: `name:` (current) else `scheme:` (legacy) else caller default (file stem). `author`, `variant`,
#     `system`, `description` are read-and-ignored (Theme has no author field).

