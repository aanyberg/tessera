[package]
name = "tessera-app-core"
description = "Application model: windows, tabs, panes, sessions, commands, plugin host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tessera-pty.workspace = true
tessera-term.workspace = true
tessera-config.workspace = true
# Shell integration scripts and their injection on spawn (ADR 0021).
tessera-shell-integration.workspace = true
tessera-plugin-api.workspace = true
tessera-plugin-hello.workspace = true
# Views: one GPU surface and renderer per session (ADR 0014).
tessera-render.workspace = true
# Names the `Cell`s a view snapshots from the grid for the renderer.
tessera-grid.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
# Enables `test-hooks` (`App::spawn_test_session`) for the integration tests.
tessera-app-core = { path = ".", features = ["test-hooks"] }
# URL detection and selection properties.
proptest.workspace = true
# `Gpu::lose_device_for_test` for this crate's device-loss tests.
tessera-render = { workspace = true, features = ["test-hooks"] }

[features]
# Exposes `App::panic_holding_session_lock` and `App::lose_gpu_for_test`
# for tests of the FFI layer.
test-hooks = ["tessera-render/test-hooks"]

[lints]
workspace = true
