[package]
name = "tessera-app-core"
description = "Application model: windows, tabs, panes, sessions, commands, plugin host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tessera-pty.workspace = true
tessera-term.workspace = true
tessera-config.workspace = true
# Shell integration scripts and their injection on spawn (ADR 0021).
tessera-shell-integration.workspace = true
tessera-plugin-api.workspace = true
# The first-party plugins the built-in host links in (ADR 0047), one
# feature each.
tessera-plugin-hello = { workspace = true, optional = true }
# Views: one GPU surface and renderer per session (ADR 0014).
tessera-render.workspace = true
# Names the `Cell`s a view snapshots from the grid for the renderer.
tessera-grid.workspace = true
# Scrollback search (ADR 0038).
tessera-search.workspace = true
# Smart selection matching (ADR 0042).
regex.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Whether a remote host shows anything (a character that takes a cell, #358).
unicode-width.workspace = true

[dev-dependencies]
tempfile = "3"
# The calling thread's CPU clock, for the timing bars that a loaded machine must not fail.
nix = { workspace = true, features = ["time"] }
# Enables `test-hooks` (`App::spawn_test_session`) for the integration tests.
tessera-app-core = { path = ".", features = ["test-hooks"] }
# URL detection and selection properties.
proptest.workspace = true
# `Gpu::lose_device_for_test` for this crate's device-loss tests.
tessera-render = { workspace = true, features = ["test-hooks"] }

[features]
default = ["plugin-hello"]
# Links in the Hello plugin (`dev.tessera.hello`), the plugin host's
# acceptance test (ADR 0047).
plugin-hello = ["dep:tessera-plugin-hello"]
# Exposes `App::panic_holding_session_lock` and `App::lose_gpu_for_test`
# for tests of the FFI layer.
test-hooks = ["tessera-render/test-hooks"]

[lints]
workspace = true
