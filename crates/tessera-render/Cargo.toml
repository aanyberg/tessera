[package]
name = "tessera-render"
description = "GPU renderer for the terminal surface (wgpu)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tessera-grid.workspace = true
# `Pod` instance and uniform structs for the render passes (ADR 0010).
bytemuck.workspace = true
# `O_NONBLOCK` and `O_NOCTTY` for the coverage index's font opens: a
# FIFO or device at a font path must not block the open (#669). The
# constants only; this crate forbids `unsafe`.
libc.workspace = true
# Shaping (harfrust), fallback, fontdb system font loading and swash
# rasterisation. `fontconfig` is off: macOS loads fonts from the system
# font directories through fontdb directly (ADR 0007).
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
pollster = "1"
raw-window-handle = "0.6"
# The rasteriser cosmic-text already builds on (same version, same
# features); used directly for 1/3 px subpixel offsets and synthetic bold,
# which cosmic-text's own `SwashCache` does not expose (ADR 0007).
# Must resolve to the same swash as cosmic-text: `Font::as_swash()` hands
# out its types. A split fails to compile (`font::build_scaler` passes that
# `FontRef` to this crate's `ScaleContext::builder`), so it cannot happen
# silently. Bump together with cosmic-text.
swash = "0.2.10"
thiserror.workspace = true
tracing.workspace = true
unicode-width.workspace = true
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl", "std"] }

[dev-dependencies]
# Golden images in tests/golden (ADR 0010).
png.workspace = true
# Property tests of the character map walk against swash's (#689).
proptest.workspace = true
# The table lookup fontdb's parse runs, as the reference the user font
# scan's lookup is tested against (#683). fontdb's version: bump together.
ttf-parser = "0.25.1"
# Enables `test-hooks` for this crate's integration tests.
tessera-render = { path = ".", features = ["test-hooks"] }
# Scratch directories removed when a test ends, failing or not (#698).
tempfile = "3"

[features]
# Exposes `Gpu::lose_device_for_test` for fault-injection tests of
# device loss (ADR 0014). Off in every release build.
test-hooks = []

[lints]
workspace = true
