# git-cliff configuration for Tessera release notes.
# https://git-cliff.org/docs/configuration
#
# Commits follow Conventional Commits (see CONTRIBUTING.md). The release
# workflow runs scripts/release-notes.sh (git-cliff with an explicit --tag and
# commit range) to produce the notes for the GitHub Release of the tag that
# triggered it; `just release-notes <tag>` renders the same output and
# `just changelog` previews the unreleased commits.

[changelog]
header = """
# Changelog

All notable changes to Tessera are listed here. The format is generated by
[git-cliff](https://git-cliff.org) from Conventional Commits.
"""
# Tera template rendered once per release. TESSERA_PREVIOUS_TAG (set by
# scripts/release-notes.sh) overrides git-cliff's own idea of the previous tag
# so a promoted rc compares against the last final release.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}
{% set prev = get_env(name="TESSERA_PREVIOUS_TAG", default="") %}\
{% if prev == "" and previous and previous.version %}{% set prev = previous.version %}{% endif %}\
{% if version and prev %}
**Full diff:** [{{ prev }}...{{ version }}](<REPO>/compare/{{ prev }}...{{ version }})
{% endif %}
"""
footer = ""
trim = true
render_always = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/aanyberg/tessera" },
]

[git]
conventional_commits = true
# Drop commits that do not parse as Conventional Commits instead of failing.
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [
    # 0.1.0 wave PRs #67 and #70 were squash-merged with "<version> wave <n>: ..." titles before wave PRs
    # were rebase-merged; count them as features so they appear in the notes.
    { pattern = '^(\d+\.\d+\.\d+ wave \d+): ', replace = "feat: ${1}: " },
    # Link "(#123)" PR/issue references.
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
# Breaking changes always appear even if a parser would otherwise skip them.
protect_breaking_commits = true
commit_parsers = [
    # Merge commits (manual merges carry a conventional subject) are noise.
    { message = "^(chore: )?[Mm]erge ", skip = true },
    # Security first: a commit of any type with a `Security: ...` git trailer
    # (footer) lands here; later parsers would otherwise claim it by type. A
    # mere mention of the word in the body does not count.
    { footer = "(?i)^security:", group = "<!-- 00 -->Security" },
    { message = "^feat", group = "<!-- 01 -->Features" },
    { message = "^fix", group = "<!-- 02 -->Bug fixes" },
    { message = "^perf", group = "<!-- 03 -->Performance" },
    { message = "^refactor", group = "<!-- 04 -->Refactoring" },
    { message = "^docs", group = "<!-- 05 -->Documentation" },
    { message = "^test", group = "<!-- 06 -->Testing" },
    { message = "^build", group = "<!-- 07 -->Build" },
    { message = "^ci", group = "<!-- 08 -->CI" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps", skip = true },
    { message = "^chore|^style", group = "<!-- 09 -->Miscellaneous" },
    { message = "^revert", group = "<!-- 10 -->Reverts" },
]
# Commits not matched above are dropped from the notes.
filter_commits = true
# Release tags are SemVer: v0.1.0 or v0.1.0-rc.1 (no leading zeros). Keep in
# sync with the tag check in .github/workflows/release.yml.
tag_pattern = "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$"
use_branch_tags = false
topo_order = false
sort_commits = "oldest"
link_parsers = []

