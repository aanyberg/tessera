# A hung test must fail the run instead of stalling it for hours (#137): after 60 s a test is reported SLOW, after
# five periods (300 s) it is terminated and the run fails. The slowest test of the whole workspace takes 12 s
# (debug, measured 2026-10-29), so the default leaves 25x headroom for a machine under load 30+.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Timing-sensitive tests run one at a time so a loaded machine cannot make
# their wall-clock bounds flake; everything else runs in parallel.
[test-groups]
timing = { max-threads = 1 }
# Tests that hold about 1.1 GB each (4095 Metal command buffers) run one at a
# time, so two never overlap on a small CI runner.
gpu-memory = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(tessera-config) & binary(reload)'
test-group = 'timing'

# The profile-file reload bound (#312 F4, 500 ms on the fastest of up to five rounds of each step; #656).
[[profile.default.overrides]]
filter = 'package(tessera-config) & binary(=profile_files) & test(=saving_adding_and_removing_a_profile_file_each_reload_once)'
test-group = 'timing'

[[profile.default.overrides]]
filter = 'package(tessera-render) & binary(shaping) & test(uncovered_characters_are_cheap_after_warm_up)'
test-group = 'timing'

[[profile.default.overrides]]
filter = 'package(tessera-render) & binary(shaping) & test(shaping_one_long_line_costs_the_same_as_many_short_ones)'
test-group = 'timing'

# (`a_paste_into_a_stopped_child_never_blocks_and_close_drops_it` has no timing group: since #429 it counts waits, not
# wall-clock time, so load cannot make it fail; nextest's slow-timeout is its backstop.)

# Wall-clock bounds on queueing and closing with input pending (#26).
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(close_drops_pending_input_promptly) | test(a_failed_writer_refuses_later_input) | test(a_panicking_writer_refuses_later_input))'
test-group = 'timing'

# Wall-clock bounds on closing PTYs with input pending (#75).
[[profile.default.overrides]]
filter = 'package(tessera-pty) & binary(close)'
test-group = 'timing'

# Non-blocking close (#79): close_session within HANGUP_GRACE / 2 (500 ms) and a
# 1 ms median over 20 closes (#179); the background reap within REAP_SLACK
# (500 ms) past the graces, or both graces (2 s, best of 3 closes) for the fake
# that ignores SIGHUP.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(close_returns_at_once_) | test(closing_twenty_) | test(close_during_an_output_flood_is_prompt_and_silent) | test(close_with_input_pending_to_a_shell_that_ignores_sighup) | test(a_closed_session_that_exits_later_reports_nothing) | test(dropping_the_app_finishes_earlier_closes_within_the_same_cap) | test(a_panicking_start_hook_does_not_strand_closing_children))'
test-group = 'timing'

[[profile.default.overrides]]
filter = 'package(tessera-ffi) & binary(lifecycle) & test(close_returns_at_once_and_free_waits_for_the_closing_children)'
test-group = 'timing'

# Bars that are ratios or mutant margins rather than absolute times, still run one at a time (#179): the DECSCUSR
# flood's 4N/N cost ratio and the clipboard deadline test (a per-command-deadline mutant is caught only while each
# failing tool takes under 1 s). `resize_is_not_starved_by_a_blocked_writer` has no clock bar and runs in parallel: its
# ratio compares two threads running side by side over a window counted in the writer's attempts (#192), so load slows
# both alike.
[[profile.default.overrides]]
filter = '(package(tessera-term) & binary(decscusr) & test(=a_flood_of_cursor_styles_requests_nothing_and_stays_linear)) | (package(tessera-devwin) & test(=clipboard::tests::the_deadline_covers_all_commands))'
test-group = 'timing'

# The latency bound of a theme-file edit (`BOUND`, a debounce plus 500 ms with headroom; #243). Every other wait of
# the theme tests is for state, with a 10 s deadline, and runs in parallel.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & binary(theme) & test(=a_theme_file_edit_applies_within_the_bound)'
test-group = 'timing'

# Release-only wall-clock bars, run by the gate's release timing step (#114).
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(reader_lock_hold_is_bounded) | test(view_metrics_are_fast_while_output_floods_the_terminal))'
test-group = 'timing'

# Release-only scrollback search bars (#46): the S6 lock hold and the 1 000 000-line scan; and the step bound under a
# slow pattern (#331).
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(search_lock_hold_is_bounded) | test(a_million_lines_) | test(no_step_outlasts_four_budgets_and_a_quarter_second))'
test-group = 'timing'

# Release-only scrolling bars (#175), also run by the gate's release timing step.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(scrolling_through_a_long_history_is_smooth) | test(a_flood_under_a_scrolled_view_keeps_captures_short))'
test-group = 'timing'

# Release-only accessibility bar (#52): the S6 lock hold of `App::accessible_text` against a frame's capture.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(accessible_text_lock_hold_is_no_longer_than_a_capture) | test(hostile_smart_rules_))'
test-group = 'timing'

# Release-only smart-selection latency bar (#47, SS-C6), also run by the gate's release timing step.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & binary(smart_selection) & test(=a_double_click_with_64_rules_on_2048_columns_takes_under_5_ms)'
test-group = 'timing'

# Release-only plugin-host throughput bar (#48, S6): 100 MB through a session with a plugin sleeping per event, also run
# by the gate's release timing step.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & binary(plugins) & test(=a_slow_plugin_keeps_session_throughput)'
test-group = 'timing'

# Release-only cost bars of the rectangular area operations (#251, B02) and of a config edit among 20 000 mark-like lines
# (#324), run by the gate's release timing step.
[[profile.default.overrides]]
filter = '(package(tessera-term) & binary(=rect) & test(b02_)) | (package(tessera-term) & binary(=rect_fixes) & (test(a_self_copy_of_a_screen_of_clusters_) | test(a_shifted_partial_copy_over_clusters_))) | (package(tessera-config) & binary(=edit) & test(=an_edit_among_many_mark_like_lines_is_fast))'
test-group = 'timing'

# Release-only cost ratios, also run by the gate's release timing step: a reload capture against a plain one (#412),
# the alternate-screen carry of a full screen (#556, interleaved runs); and the ten-million-case DECFRA differential
# (#556, no clock bar, but it holds one core for 14-27 s beside the bars).
[[profile.default.overrides]]
filter = '(package(tessera-app-core) & kind(lib) & test(a_reload_capture_costs_)) | (package(tessera-term) & binary(=stuck_modes) & test(=the_carry_of_a_full_screen_costs_a_tenth_more_at_most)) | (package(tessera-term) & binary(=rect_fixes) & test(=decfra_fills_like_printing_for_random_charset_states))'
test-group = 'timing'

# OZ01's linear-time bar on an OSC 4 query flood (#617): a 10N/N ratio of the thread's CPU time, as the DECSCUSR flood.
[[profile.default.overrides]]
filter = 'package(tessera-term) & binary(=osc_color) & test(=a_flood_of_queries_is_answered_in_linear_time)'
test-group = 'timing'

# The search cap test (#447, #489): a pass with a late piece keeps no copy, so under load it asserted on a stall rather
# than on the cap (it failed 33 of 200 runs at load 35 before it fixed its budget); it still runs alone.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & test(=search::tests::the_kept_copy_and_its_spares_stay_within_the_cap)'
test-group = 'timing'

# Release-only memory-per-session and startup budgets (#216), run by the gate's release timing step.
[[profile.default.overrides]]
filter = 'package(tessera-ffi) & binary(=budgets)'
test-group = 'timing'

# Device loss through a full Metal command queue (#84): ~1.1 GB each.
[[profile.default.overrides]]
filter = '(package(tessera-app-core) & kind(lib) & test(a_loss_inside_the_frame_detaches_at_once)) | (package(tessera-render) & binary(device_loss) & test(a_device_error_loses_the_device_during_the_call_that_hit_it))'
test-group = 'gpu-memory'

# The slowest tests (file-watcher polling, ligature shaping at every size, GPU queues, hdiutil): 12 s at most
# measured, 600 s before they are terminated.
[[profile.default.overrides]]
filter = '(package(tessera-config) & (binary(watch_themes) | binary(reload))) | (package(tessera-render) & binary(shaping)) | (package(tessera-devtool) & binary(theme)) | (package(tessera-term) & binary(wide))'
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = '(package(tessera-app-core) & kind(lib) & test(a_loss_inside_the_frame_detaches_at_once)) | (package(tessera-render) & binary(device_loss))'
slow-timeout = { period = "60s", terminate-after = 10 }

# The FFI surface tests bring up a GPU device per attach and wait on a shell (each reply up to 60 s, #316). With eight
# runs at once on a loaded machine a passing run took up to 248 s, close to the default 300 s limit, so they get 600 s
# (#321). An unloaded run takes under a second.
[[profile.default.overrides]]
filter = 'package(tessera-ffi) & binary(surface)'
slow-timeout = { period = "60s", terminate-after = 10 }

# The #555 renderer tests skip when the host's fonts do not fit their probe characters (#594): their `SKIP` line goes
# to the log at the end of the run, where a passing test's output is otherwise hidden.
[[profile.default.overrides]]
filter = 'package(tessera-render) & kind(lib) & (test(=renderer::tests::a_synthetic_bold_row_is_reshaped_with_the_real_bold_when_the_index_lands) | test(=renderer::tests::a_notdef_row_is_reshaped_with_the_covering_face_when_the_index_lands))'
success-output = "final"
