# Timing-sensitive tests run one at a time so a loaded machine cannot make
# their wall-clock bounds flake; everything else runs in parallel.
[test-groups]
timing = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(tessera-config) & binary(reload)'
test-group = 'timing'

[[profile.default.overrides]]
filter = 'package(tessera-render) & binary(shaping) & test(uncovered_characters_are_cheap_after_warm_up)'
test-group = 'timing'

[[profile.default.overrides]]
filter = 'package(tessera-render) & binary(shaping) & test(shaping_one_long_line_costs_the_same_as_many_short_ones)'
test-group = 'timing'

# Wall-clock bounds on queueing and closing with input pending (#26).
[[profile.default.overrides]]
filter = 'package(tessera-ffi) & binary(input) & test(a_paste_into_a_stopped_child_never_blocks_and_close_drops_it)'
test-group = 'timing'

[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(close_drops_pending_input_promptly) | test(a_failed_writer_refuses_later_input) | test(a_panicking_writer_refuses_later_input))'
test-group = 'timing'

# Wall-clock bounds on closing PTYs with input pending (#75).
[[profile.default.overrides]]
filter = 'package(tessera-pty) & binary(close)'
test-group = 'timing'

# Non-blocking close (#79): 5 ms bounds on close_session and 500 ms on the
# background reap.
[[profile.default.overrides]]
filter = 'package(tessera-app-core) & kind(lib) & (test(close_returns_at_once_) | test(closing_twenty_) | test(close_during_an_output_flood_is_prompt_and_silent) | test(close_with_input_pending_to_a_shell_that_ignores_sighup) | test(a_closed_session_that_exits_later_reports_nothing) | test(dropping_the_app_finishes_earlier_closes_within_the_same_cap) | test(a_panicking_start_hook_does_not_strand_closing_children))'
test-group = 'timing'

[[profile.default.overrides]]
filter = 'package(tessera-ffi) & binary(lifecycle) & test(close_returns_at_once_and_free_waits_for_the_closing_children)'
test-group = 'timing'
