[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [{ id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained (not a vulnerability); pulled in by cosmic-text 0.19 via fontdb and only parses installed system fonts. Revisit when cosmic-text moves to skrifa/read-fonts. See ADR 0007." }]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
