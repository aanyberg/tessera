name: Tessera
options:
  bundleIdPrefix: com.aanyberg
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Tessera:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tessera
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Tessera
        CFBundleDisplayName: Tessera
        CFBundleIdentifier: com.aanyberg.tessera
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Alexander Nyberg. MIT OR Apache-2.0."
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: Resources/Tessera.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - framework: TesseraCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aanyberg.tessera
        SWIFT_OBJC_INTEROP_MODE: objc
