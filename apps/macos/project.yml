name: Tessera
options:
  bundleIdPrefix: com.aanyberg
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    # Overridden by the release workflow from the git tag (see justfile `archive`).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tessera:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tessera
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Tessera
        CFBundleDisplayName: Tessera
        CFBundleIdentifier: com.aanyberg.tessera
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Alexander Nyberg. MIT OR Apache-2.0."
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: Resources/Tessera.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      # The app reaches the Rust core only through the Swift wrapper (ADR 0012).
      # Static, so nothing is embedded: with the hardened runtime, dyld's library
      # validation rejects an ad-hoc signed framework (no Team ID) at launch.
      - target: TesseraKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aanyberg.tessera
        SWIFT_OBJC_INTEROP_MODE: objc
    scheme: {}
  # Swift wrapper over the C module `TesseraCore` (the generated TesseraCore.h in
  # TesseraCore.xcframework). The static Rust library is linked into this framework.
  TesseraKit:
    type: framework.static
    platform: macOS
    sources:
      - path: Sources/TesseraKit
    dependencies:
      - framework: TesseraCore.xcframework
        embed: false
      # What the Rust renderer in libtessera_ffi.a (wgpu's Metal backend
      # through objc2) links against, from `cargo rustc -p tessera-ffi --lib
      # --crate-type staticlib -- --print native-static-libs` (ADR 0014).
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreFoundation.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aanyberg.TesseraKit
        GENERATE_INFOPLIST_FILE: YES
        # Linked into Tessera.app; keeps `xcodebuild archive` an application archive.
        SKIP_INSTALL: YES
        # libtool merges libtessera_ffi.a into TesseraKit.a; Rust's empty object
        # files (cfg_if, compiler_builtins) would each print a warning.
        OTHER_LIBTOOLFLAGS: -no_warning_for_no_symbols
    scheme:
      testTargets:
        - TesseraKitTests
  TesseraKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TesseraKitTests
    dependencies:
      - target: TesseraKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aanyberg.TesseraKitTests
        GENERATE_INFOPLIST_FILE: YES
